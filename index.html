<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rec Room - Dorm Room P2P</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none; background-color: #000; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Écran de connexion */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff5722; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        #username-input {
            padding: 15px; font-size: 18px; border: none; border-radius: 25px;
            width: 70%; max-width: 300px; text-align: center; margin-bottom: 20px; outline: none;
        }
        .btn { padding: 12px 25px; font-size: 16px; background: white; color: #ff5722; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; margin: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #room-input { padding: 10px; border-radius: 10px; border: none; margin-top: 10px; text-align: center; display: none;}

        /* Joysticks tactiles */
        #touch-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: box-none; display: none; }
        .joystick-base { position: absolute; width: 85px; height: 85px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .joystick-knob { width: 35px; height: 35px; border-radius: 50%; position: absolute; }
        #joy-move { bottom: 20px; left: 20px; }
        #joy-hand-l { top: 20px; left: 20px; }
        #joy-hand-r { top: 20px; right: 20px; }
        #joy-move .joystick-knob { background: #ff5722; }
        #joy-hand-l .joystick-knob { background: #00bcd4; }
        #joy-hand-r .joystick-knob { background: #4caf50; }
        #jump-button { position: absolute; bottom: 30px; right: 20px; width: 70px; height: 50px; background: rgba(255, 87, 34, 0.8); border: 2px solid white; border-radius: 25px; color: white; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: 12px; }
        
        /* Infos en haut */
        #ui-layer { position: absolute; top: 15px; left: 15px; color: white; z-index: 10; font-size: 14px; text-shadow: 1px 1px 2px black; pointer-events: none; display: none; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="login-screen">
        <h1 style="margin-bottom: 5px;">DORM ROOM 3D</h1>
        <input type="text" id="username-input" placeholder="Ton Pseudo..." maxlength="12">
        
        <div>
            <button class="btn" id="btn-create">CRÉER UN SALON</button>
            <button class="btn" id="btn-join">REJOINDRE UN SALON</button>
        </div>
        <input type="text" id="room-input" placeholder="Coller le code du salon ici...">
        <button class="btn" id="btn-submit" style="display: none; background: #2196f3; color: white;">CONNEXION</button>
    </div>

    <div id="ui-layer">
        <p id="room-display" style="margin:0; font-weight: bold; color: #ff5722; pointer-events: auto; user-select: text; -webkit-user-select: text;"></p>
        <p id="player-count" style="margin: 5px 0 0 0;">Seul dans ta Dorm Room</p>
    </div>

    <div id="touch-controls">
        <div class="joystick-base" id="joy-move"><div class="joystick-knob" id="knob-move"></div></div>
        <div class="joystick-base" id="joy-hand-l"><div class="joystick-knob" id="knob-hand-l"></div></div>
        <div class="joystick-base" id="joy-hand-r"><div class="joystick-knob" id="knob-hand-r"></div></div>
        <div id="jump-button">SAUT</div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        
        let camera, scene, renderer, leftHand, rightHand;
        let myUsername = "Player";
        let isHost = false;
        let roomCode = "";
        
        let moveForward = 0, moveRight = 0, handL_X = 0, handL_Y = 0, handR_X = 0, handR_Y = 0;
        let canJump = false, velocityY = 0;
        let lon = -90, lat = 0, phi = 0, theta = 0;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0, onPointerDownLon = 0, onPointerDownLat = 0;

        const clock = new THREE.Clock();
        const baseHandL = new THREE.Vector3(-0.4, -0.4, -0.8);
        const baseHandR = new THREE.Vector3(0.4, -0.4, -0.8);

        let otherPlayers = {};
        let peer, connections = [];

        document.getElementById('btn-create').addEventListener('click', () => { isHost = true; startSetup(); });
        document.getElementById('btn-join').addEventListener('click', () => { isHost = false; document.getElementById('room-input').style.display = 'block'; document.getElementById('btn-submit').style.display = 'inline-block'; });
        document.getElementById('btn-submit').addEventListener('click', () => { roomCode = document.getElementById('room-input').value.trim(); if(roomCode) startSetup(); });

        function startSetup() {
            const input = document.getElementById('username-input').value.trim();
            if(input) myUsername = input;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('touch-controls').style.display = 'block';
            document.getElementById('ui-layer').style.display = 'block';
            initGame();
        }

        function initGame() {
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 2); 

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0f2e);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sunLight = new THREE.DirectionalLight(0xfff1e0, 0.6);
            sunLight.position.set(5, 8, 5);
            scene.add(sunLight);

            // --- CRÉATION DE LA DORM ROOM ---
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xd7ccc8, roughness: 0.6 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const rug = new THREE.Mesh(new THREE.BoxGeometry(6, 0.02, 6), new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.9 }));
            rug.position.set(0, 0.01, 0);
            scene.add(rug);

            const wallOrange = new THREE.MeshStandardMaterial({ color: 0xe65100 });
            const wallBlue = new THREE.MeshStandardMaterial({ color: 0x0277bd });
            const wallWhite = new THREE.MeshStandardMaterial({ color: 0xeceff1 });

            const backWall = new THREE.Mesh(new THREE.BoxGeometry(12, 5, 0.4), wallBlue);
            backWall.position.set(0, 2.5, -6);
            scene.add(backWall);

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(12, 5, 0.4), wallWhite);
            frontWall.position.set(0, 2.5, 6);
            scene.add(frontWall);

            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 12), wallOrange);
            leftWall.position.set(-6, 2.5, 0);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 12), wallWhite);
            rightWall.position.set(6, 2.5, 0);
            scene.add(rightWall);

            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), wallWhite);
            ceiling.position.y = 5;
            ceiling.rotation.x = Math.PI / 2;
            scene.add(ceiling);

            const bedGroup = new THREE.Group();
            const bedBase = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0x3e2723 }));
            bedBase.position.set(0, 0.3, 0);
            const mattress = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.4, 3.8), new THREE.MeshStandardMaterial({ color: 0xffa726 }));
            mattress.position.set(0, 0.7, 0);
            const pillow = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 0.8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            pillow.position.set(0, 0.9, -1.4);
            bedGroup.add(bedBase, mattress, pillow);
            bedGroup.position.set(-4.5, 0, -3.8);
            scene.add(bedGroup);

            const mirrorFrame = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 1.5), new THREE.MeshStandardMaterial({ color: 0xff5722 }));
            mirrorFrame.position.set(5.75, 1.8, 0);
            const mirrorGlass = new THREE.Mesh(new THREE.BoxGeometry(0.11, 2, 1.3), new THREE.MeshStandardMaterial({ color: 0xcfd8dc, roughness: 0, metalness: 0.9 }));
            mirrorGlass.position.set(5.75, 1.8, 0);
            scene.add(mirrorFrame, mirrorGlass);

            const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.8, 0.1), new THREE.MeshStandardMaterial({ color: 0x212121 }));
            doorFrame.position.set(0, 1.4, 5.75);
            const doorKey = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.6, 0.12), new THREE.MeshStandardMaterial({ color: 0x00bcd4 }));
            doorKey.position.set(0, 1.4, 5.75);
            scene.add(doorFrame, doorKey);

            const shelf = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.8), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
            shelf.position.set(4.4, 2.2, -5.4);
            scene.add(shelf);

            const handGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const handMat = new THREE.MeshStandardMaterial({ color: 0xff5722 });
            leftHand = new THREE.Mesh(handGeo, handMat); leftHand.position.copy(baseHandL); camera.add(leftHand);
            rightHand = new THREE.Mesh(handGeo, handMat); rightHand.position.copy(baseHandR); camera.add(rightHand);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            setupMobileControls();
            initNetworkP2P();
            
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function initNetworkP2P() {
            if (isHost) {
                const generatedId = "REC-" + Math.floor(1000 + Math.random() * 9000);
                peer = new Peer(generatedId);
                peer.on('open', (id) => { document.getElementById('room-display').innerText = "Code de ta Chambre : " + id; });
                peer.on('connection', (conn) => { setupConnectionEvents(conn); connections.push(conn); });
            } else {
                peer = new Peer();
                peer.on('open', () => {
                    document.getElementById('room-display').innerText = "Dans la Chambre : " + roomCode;
                    const conn = peer.connect(roomCode);
                    setupConnectionEvents(conn); connections.push(conn);
                });
            }
            
            setInterval(() => {
                const wpL = new THREE.Vector3(); leftHand.getWorldPosition(wpL);
                const wpR = new THREE.Vector3(); rightHand.getWorldPosition(wpR);
                const myData = {
                    id: peer.id, username: myUsername,
                    x: camera.position.x, y: camera.position.y, z: camera.position.z,
                    lhX: wpL.x, lhY: wpL.y, lhZ: wpL.z, rhX: wpR.x, rhY: wpR.y, rhZ: wpR.z
                };
                connections.forEach(conn => { if (conn.open) conn.send(myData); });
            }, 40);
        }

        function setupConnectionEvents(conn) {
            conn.on('data', (data) => {
                handlePlayerData(data);
                if (isHost) {
                    connections.forEach(c => { if (c.peer !== conn.peer && c.open) c.send(data); });
                }
            });
            conn.on('close', () => {
                Object.keys(otherPlayers).forEach(id => {
                    if(otherPlayers[id].peerId === conn.peer) {
                        scene.remove(otherPlayers[id].body);
                        scene.remove(otherPlayers[id].label);
                        delete otherPlayers[id];
                    }
                });
                updateCount();
            });
        }

        function handlePlayerData(data) {
            const id = data.id; if (!id) return;

            if (!otherPlayers[id]) {
                const playerGroup = new THREE.Group();
                const bodyMesh = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({ color: 0x0287bd }));
                playerGroup.add(bodyMesh);

                const hMat = new THREE.MeshStandardMaterial({ color: 0xffa500 });
                const oLeftHand = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), hMat);
                const oRightHand = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), hMat);
                playerGroup.add(oLeftHand, oRightHand);
                scene.add(playerGroup);

                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, 256, 64);
                ctx.font = 'bold 26px Arial'; ctx.fillStyle = 'white'; ctx.textAlign = 'center';
                ctx.fillText(data.username || "Player", 128, 40);
                
                const texture = new THREE.CanvasTexture(canvas);
                const labelSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, depthTest: false }));
                labelSprite.scale.set(2, 0.5, 1);
                scene.add(labelSprite);

                otherPlayers[id] = { body: playerGroup, label: labelSprite, lh: oLeftHand, rh: oRightHand, peerId: id };
                updateCount();
            }

            const p = otherPlayers[id];
            p.body.position.set(data.x, data.y - 0.4, data.z);
            p.label.position.set(data.x, data.y + 0.6, data.z);
            if(data.lhX) p.lh.position.set(data.lhX - data.x, data.lhY - (data.y - 0.4), data.lhZ - data.z);
            if(data.rhX) p.rh.position.set(data.rhX - data.x, data.rhY - (data.y - 0.4), data.rhZ - data.z);
        }

        function updateCount() {
            const count = Object.keys(otherPlayers).length + 1;
            document.getElementById('player-count').innerText = `${count} joueur(s) dans la Chambre`;
        }

        function setupMobileControls() {
            const jumpBtn = document.getElementById('jump-button');
            let moveTouchId = null, handLTouchId = null, handRTouchId = null;

            document.addEventListener('touchstart', (e) => {
                if(e.target.id === 'btn-create' || e.target.id === 'btn-join' || e.target.id === 'btn-submit') return;

                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    const x = touch.clientX; const y = touch.clientY;

                    if (x < 150 && y > window.innerHeight - 150) moveTouchId = touch.identifier;
                    else if (x < 150 && y < 150) handLTouchId = touch.identifier;
                    else if (x > window.innerWidth - 150 && y < 150) handRTouchId = touch.identifier;
                    else if (!(x > window.innerWidth - 120 && y > window.innerHeight - 120)) {
                        onPointerDownPointerX = x; onPointerDownPointerY = y;
                        onPointerDownLon = lon; onPointerDownLat = lat;
                    }
                }
            });

            document.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === moveTouchId) {
                        updateJoystick('joy-move', 'knob-move', touch, (nx, ny) => { moveRight = nx; moveForward = -ny; });
                    } else if (touch.identifier === handLTouchId) {
                        updateJoystick('joy-hand-l', 'knob-hand-l', touch, (nx, ny) => { handL_X = nx; handL_Y = -ny; });
                    } else if (touch.identifier === handRTouchId) {
                        updateJoystick('joy-hand-r', 'knob-hand-r', touch, (nx, ny) => { handR_X = nx; handR_Y = -ny; });
                    } else {
                        if(moveTouchId !== touch.identifier && handLTouchId !== touch.identifier && handRTouchId !== touch.identifier) {
                            lon = (touch.clientX - onPointerDownPointerX) * 0.2 + onPointerDownLon;
                            lat = (onPointerDownPointerY - touch.clientY) * 0.2 + onPointerDownLat;
                        }
                    }
                }
            });

            document.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === moveTouchId) { moveTouchId = null; resetJoystick('knob-move'); moveForward = 0; moveRight = 0; }
                    else if (touch.identifier === handLTouchId) { handLTouchId = null; resetJoystick('knob-hand-l'); handL_X = 0; handL_Y = 0; }
                    else if (touch.identifier === handRTouchId) { handRTouchId = null; resetJoystick('knob-hand-r'); handR_X = 0; handR_Y = 0; }
                }
            });

            function updateJoystick(baseId, knobId, touch, callback) {
                const base = document.getElementById(baseId); const knob = document.getElementById(knobId);
                const rect = base.getBoundingClientRect();
                const kx = Math.max(-35, Math.min(35, touch.clientX - (rect.left + 42)));
                const ky = Math.max(-35, Math.min(35, touch.clientY - (rect.top + 42)));
                knob.style.transform = `translate(${kx}px, ${ky}px)`;
                callback(kx / 35, ky / 35);
            }
            function resetJoystick(knobId) { document.getElementById(knobId).style.transform = 'translate(0px, 0px)'; }

            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (canJump) { velocityY = 11; canJump = false; } });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Gravité et Saut
            velocityY -= 28 * delta;
            camera.position.y += velocityY * delta;

            if (camera.position.y <= 2) {
                camera.position.y = 2;
                velocityY = 0;
                canJump = true;
            }

            // Direction de la caméra (Vue)
            lat = Math.max(-85, Math.min(85, lat));
            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const target = new THREE.Vector3();
            target.x = camera.position.x + Math.sin(phi) * Math.sin(theta);
            target.y = camera.position.y + Math.cos(phi);
            target.z = camera.position.z + Math.sin(phi) * Math.cos(theta);
            camera.lookAt(target);

            // Déplacement du joueur
            const speed = 4 * delta;
            const forward = new THREE.Vector3(Math.sin(theta), 0, Math.cos(theta)).normalize();
            const right = new THREE.Vector3(Math.sin(theta - Math.PI/2), 0, Math.cos(theta - Math.PI/2)).normalize();

            camera.position.addScaledVector(forward, moveForward * speed);
            camera.position.addScaledVector(right, moveRight * speed);

            // Limites des murs de la Chambre (Pas sortir des 12x12)
            camera.position.x = Math.max(-5.5, Math.min(5.5, camera.position.x));
            camera.position.z = Math.max(-5.5, Math.min(5.5, camera.position.z));

            // Animation des Mains
            leftHand.position.copy(baseHandL).add(new THREE.Vector3(handL_X * 0.3, handL_Y * 0.3, 0));
            rightHand.position.copy(baseHandR).add(new THREE.Vector3(handR_X * 0.3, handR_Y * 0.3, 0));

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
