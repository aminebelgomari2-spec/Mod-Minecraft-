<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rec Room - Dorm Room P2P</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none; background-color: #000; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Écran de connexion */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff5722; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        #username-input {
            padding: 15px; font-size: 18px; border: none; border-radius: 25px;
            width: 70%; max-width: 300px; text-align: center; margin-bottom: 20px; outline: none;
        }
        .btn { padding: 12px 25px; font-size: 16px; background: white; color: #ff5722; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; margin: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #room-input { padding: 10px; border-radius: 10px; border: none; margin-top: 10px; text-align: center; display: none;}

        /* NOUVEAU SYSTÈME DE BOUTONS PAD DIRECTIONNEL */
        #touch-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: none; }
        
        .pad-container { position: absolute; bottom: 30px; left: 30px; width: 160px; height: 160px; pointer-events: auto; }
        .pad-btn { position: absolute; width: 50px; height: 50px; background: rgba(255, 87, 34, 0.75); border: 2px solid white; border-radius: 12px; color: white; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: 20px; active-background: #ff5722; }
        #btn-up { top: 0; left: 55px; }
        #btn-down { bottom: 0; left: 55px; }
        #btn-left { top: 55px; left: 0; }
        #btn-right { top: 55px; right: 0; }

        /* Bouton de saut à droite */
        #jump-button { position: absolute; bottom: 45px; right: 30px; width: 75px; height: 75px; background: rgba(33, 150, 243, 0.8); border: 2px solid white; border-radius: 50%; color: white; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: 14px; pointer-events: auto; }
        
        /* Infos de l'interface */
        #ui-layer { position: absolute; top: 15px; left: 15px; color: white; z-index: 10; font-size: 14px; text-shadow: 1px 1px 2px black; pointer-events: none; display: none; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="login-screen">
        <h1 style="margin-bottom: 5px;">DORM ROOM 3D</h1>
        <p style="margin: 0 0 15px 0; font-size: 12px; opacity: 0.8;">Voice Chat Intégré</p>
        <input type="text" id="username-input" placeholder="Ton Pseudo..." maxlength="12">
        
        <div>
            <button class="btn" id="btn-create">CRÉER UN SALON</button>
            <button class="btn" id="btn-join">REJOINDRE UN SALON</button>
        </div>
        <input type="text" id="room-input" placeholder="Coller le code du salon ici...">
        <button class="btn" id="btn-submit" style="display: none; background: #2196f3; color: white;">CONNEXION</button>
    </div>

    <div id="ui-layer">
        <p id="room-display" style="margin:0; font-weight: bold; color: #ff5722; pointer-events: auto; user-select: text; -webkit-user-select: text;"></p>
        <p id="player-count" style="margin: 5px 0 0 0;">Seul dans ta Dorm Room</p>
    </div>

    <div id="touch-controls">
        <div class="pad-container">
            <div class="pad-btn" id="btn-up">▲</div>
            <div class="pad-btn" id="btn-left">◀</div>
            <div class="pad-btn" id="btn-right">▶</div>
            <div class="pad-btn" id="btn-down">▼</div>
        </div>
        <div id="jump-button">SAUT</div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        
        let camera, scene, renderer, leftHand, rightHand;
        let myUsername = "Player";
        let isHost = false;
        let roomCode = "";
        
        // États de mouvement simples
        let moveForward = 0, moveRight = 0;
        let canJump = false, velocityY = 0;
        let lon = -90, lat = 0, phi = 0, theta = 0;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0, onPointerDownLon = 0, onPointerDownLat = 0;

        const clock = new THREE.Clock();
        const baseHandL = new THREE.Vector3(-0.4, -0.4, -0.8);
        const baseHandR = new THREE.Vector3(0.4, -0.4, -0.8);

        let otherPlayers = {};
        let peer, connections = [];
        let myLocalAudioStream = null;

        document.getElementById('btn-create').addEventListener('click', () => { isHost = true; startSetup(); });
        document.getElementById('btn-join').addEventListener('click', () => { isHost = false; document.getElementById('room-input').style.display = 'block'; document.getElementById('btn-submit').style.display = 'inline-block'; });
        document.getElementById('btn-submit').addEventListener('click', () => { roomCode = document.getElementById('room-input').value.trim(); if(roomCode) startSetup(); });

        function startSetup() {
            const input = document.getElementById('username-input').value.trim();
            if(input) myUsername = input;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('touch-controls').style.display = 'block';
            document.getElementById('ui-layer').style.display = 'block';
            
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => { myLocalAudioStream = stream; })
                .catch(err => { console.log("Audio non dispo :", err); })
                .finally(() => { initGame(); });
        }

        function initGame() {
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 2); 

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0f2e);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            
            const sunLight = new THREE.DirectionalLight(0xfff1e0, 0.6);
            sunLight.position.set(5, 8, 5);
            scene.add(sunLight);

            // --- DECOR DORM ROOM ---
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xd7ccc8, roughness: 0.6 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const rug = new THREE.Mesh(new THREE.BoxGeometry(6, 0.02, 6), new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.9 }));
            rug.position.set(0, 0.01, 0);
            scene.add(rug);

            const wallOrange = new THREE.MeshStandardMaterial({ color: 0xe65100 });
            const wallBlue = new THREE.MeshStandardMaterial({ color: 0x0277bd });
            const wallWhite = new THREE.MeshStandardMaterial({ color: 0xeceff1 });

            const backWall = new THREE.Mesh(new THREE.BoxGeometry(12, 5, 0.4), wallBlue);
            backWall.position.set(0, 2.5, -6); scene.add(backWall);

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(12, 5, 0.4), wallWhite);
            frontWall.position.set(0, 2.5, 6); scene.add(frontWall);

            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 12), wallOrange);
            leftWall.position.set(-6, 2.5, 0); scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 12), wallWhite);
            rightWall.position.set(6, 2.5, 0); scene.add(rightWall);

            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), wallWhite);
            ceiling.position.y = 5; ceiling.rotation.x = Math.PI / 2; scene.add(ceiling);

            // Lit
            const bedGroup = new THREE.Group();
            const bedBase = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0x3e2723 })); bedBase.position.set(0, 0.3, 0);
            const mattress = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.4, 3.8), new THREE.MeshStandardMaterial({ color: 0xffa726 })); mattress.position.set(0, 0.7, 0);
            const pillow = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 0.8), new THREE.MeshStandardMaterial({ color: 0xffffff })); pillow.position.set(0, 0.9, -1.4);
            bedGroup.add(bedBase, mattress, pillow); bedGroup.position.set(-4.5, 0, -3.8); scene.add(bedGroup);

            const handGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const handMat = new THREE.MeshStandardMaterial({ color: 0xff5722 });
            leftHand = new THREE.Mesh(handGeo, handMat); leftHand.position.copy(baseHandL); camera.add(leftHand);
            rightHand = new THREE.Mesh(handGeo, handMat); rightHand.position.copy(baseHandR); camera.add(rightHand);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            setupButtonControls();
            initNetworkP2P();
            
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function initNetworkP2P() {
            if (isHost) {
                const generatedId = "REC-" + Math.floor(1000 + Math.random() * 9000);
                peer = new Peer(generatedId);
                peer.on('open', (id) => { document.getElementById('room-display').innerText = "Code de ta Chambre : " + id; });
                peer.on('connection', (conn) => { setupConnectionEvents(conn); connections.push(conn); });
                peer.on('call', (call) => { if (myLocalAudioStream) call.answer(myLocalAudioStream); handleVoiceStream(call); });
            } else {
                peer = new Peer();
                peer.on('open', () => {
                    document.getElementById('room-display').innerText = "Dans la Chambre : " + roomCode;
                    const conn = peer.connect(roomCode);
                    setupConnectionEvents(conn); connections.push(conn);
                    if (myLocalAudioStream) peer.call(roomCode, myLocalAudioStream);
                });
                peer.on('call', (call) => { if (myLocalAudioStream) call.answer(myLocalAudioStream); handleVoiceStream(call); });
            }
            
            setInterval(() => {
                if(!peer || peer.destroyed) return;
                const wpL = new THREE.Vector3(); leftHand.getWorldPosition(wpL);
                const wpR = new THREE.Vector3(); rightHand.getWorldPosition(wpR);
                const myData = {
                    id: peer.id, username: myUsername,
                    x: camera.position.x, y: camera.position.y, z: camera.position.z,
                    lhX: wpL.x, lhY: wpL.y, lhZ: wpL.z, rhX: wpR.x, rhY: wpR.y, rhZ: wpR.z
                };
                connections.forEach(conn => { if (conn.open) conn.send(myData); });
            }, 40);
        }

        function handleVoiceStream(call) {
            call.on('stream', (remoteStream) => {
                if (document.getElementById(`audio-${call.peer}`)) return;
                const audioEl = document.createElement('audio');
                audioEl.id = `audio-${call.peer}`; audioEl.srcObject = remoteStream; audioEl.autoplay = true; audioEl.style.display = 'none';
                document.body.appendChild(audioEl);
            });
        }

        function setupConnectionEvents(conn) {
            conn.on('data', (data) => {
                handlePlayerData(data);
                if (isHost) {
                    connections.forEach(c => { 
                        if (c.peer !== conn.peer && c.open) {
                            c.send(data);
                            if (!otherPlayers[data.id]?.called && myLocalAudioStream) {
                                peer.call(data.id, myLocalAudioStream);
                                if (otherPlayers[data.id]) otherPlayers[data.id].called = true;
                            }
                        } 
                    });
                }
            });
            conn.on('close', () => {
                Object.keys(otherPlayers).forEach(id => {
                    if(otherPlayers[id].peerId === conn.peer) {
                        scene.remove(otherPlayers[id].body); scene.remove(otherPlayers[id].label);
                        const audioEl = document.getElementById(`audio-${conn.peer}`); if (audioEl) audioEl.remove();
                        delete otherPlayers[id];
                    }
                });
                updateCount();
            });
        }

        function handlePlayerData(data) {
            const id = data.id; if (!id) return;
            if (!otherPlayers[id]) {
                const playerGroup = new THREE.Group();
                const bodyMesh = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({ color: 0x0287bd }));
                playerGroup.add(bodyMesh);
                const hMat = new THREE.MeshStandardMaterial({ color: 0xffa500 });
                const oLeftHand = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), hMat);
                const oRightHand = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), hMat);
                playerGroup.add(oLeftHand, oRightHand); scene.add(playerGroup);

                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, 256, 64);
                ctx.font = 'bold 26px Arial'; ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.fillText(data.username || "Player", 128, 40);
                const texture = new THREE.CanvasTexture(canvas);
                const labelSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, depthTest: false }));
                labelSprite.scale.set(2, 0.5, 1); scene.add(labelSprite);

                otherPlayers[id] = { body: playerGroup, label: labelSprite, lh: oLeftHand, rh: oRightHand, peerId: id };
                updateCount();
            }
            const p = otherPlayers[id];
            p.body.position.set(data.x, data.y - 0.4, data.z); p.label.position.set(data.x, data.y + 0.6, data.z);
            if(data.lhX) p.lh.position.set(data.lhX - data.x, data.lhY - (data.y - 0.4), data.lhZ - data.z);
            if(data.rhX) p.rh.position.set(data.rhX - data.x, data.rhY - (data.y - 0.4), data.rhZ - data.z);
        }

        function updateCount() {
            document.getElementById('player-count').innerText = `${Object.keys(otherPlayers).length + 1} joueur(s) dans la Chambre`;
        }

        // --- NOUVELLE TECHNIQUE : DETECTION DES BOUTONS DIRECTIONNELS SANS BUG ---
        function setupButtonControls() {
            const up = document.getElementById('btn-up');
            const down = document.getElementById('btn-down');
            const left = document.getElementById('btn-left');
            const right = document.getElementById('btn-right');
            const jumpBtn = document.getElementById('jump-button');

            // Événements boutons directionnels (Touch & Souris au cas où)
            const bindBtn = (el, pressCallback, releaseCallback) => {
                el.addEventListener('touchstart', (e) => { e.preventDefault(); pressCallback(); }, { passive: false });
                el.addEventListener('touchend', (e) => { e.preventDefault(); releaseCallback(); }, { passive: false });
                el.addEventListener('mousedown', () => pressCallback());
                el.addEventListener('mouseup', () => releaseCallback());
            };

            bindBtn(up, () => moveForward = 1, () => moveForward = (moveForward == 1 ? 0 : moveForward));
            bindBtn(down, () => moveForward = -1, () => moveForward = (moveForward == -1 ? 0 : moveForward));
            bindBtn(left, () => moveRight = -1, () => moveRight = (moveRight == -1 ? 0 : moveRight));
            bindBtn(right, () => moveRight = 1, () => moveRight = (moveRight == 1 ? 0 : moveRight));

            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (canJump) { velocityY = 11; canJump = false; } }, { passive: false });
            jumpBtn.addEventListener('mousedown', () => { if (canJump) { velocityY = 11; canJump = false; } });

            // Mouvement de caméra sur le reste de l'écran vide
            document.addEventListener('touchstart', (e) => {
                if(e.target.closest('.pad-container') || e.target.id === 'jump-button' || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
                let touch = e.changedTouches[0];
                onPointerDownPointerX = touch.clientX; onPointerDownPointerY = touch.clientY;
                onPointerDownLon = lon; onPointerDownLat = lat;
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if(e.target.closest('.pad-container') || e.target.id === 'jump-button') return;
                let touch = e.changedTouches[0];
                lon = (touch.clientX - onPointerDownPointerX) * 0.3 + onPointerDownLon;
                lat = (onPointerDownPointerY - touch.clientY) * 0.3 + onPointerDownLat;
            }, { passive: true });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime(); const delta = Math.min(clock.getDelta(), 0.1);

            lat = Math.max(-85, Math.min(85, lat));
            phi = THREE.MathUtils.degToRad(90 - lat); theta = THREE.MathUtils.degToRad(lon);

            const targetPosition = new THREE.Vector3(
                camera.position.x + Math.sin(phi) * Math.sin(theta),
                camera.position.y + Math.cos(phi),
                camera.position.z + Math.sin(phi) * Math.cos(theta)
            );
            camera.lookAt(targetPosition);

            // Calcul du déplacement basé sur l'orientation de l'écran
            const dirX = Math.sin(theta); const dirZ = Math.cos(theta);
            
            if (moveForward !== 0) {
                camera.position.x += dirX * moveForward * 4 * delta;
                camera.position.z += dirZ * moveForward * 4 * delta;
            }
            if (moveRight !== 0) {
                camera.position.x += dirZ * moveRight * 4 * delta;
                camera.position.z -= dirX * moveRight * 4 * delta;
            }

            // Collisions strictes Dorm Room
            camera.position.x = Math.max(-5.4, Math.min(5.4, camera.position.x));
            camera.position.z = Math.max(-5.4, Math.min(5.4, camera.position.z));

            // Gravité physique
            velocityY -= 26 * delta; camera.position.y += velocityY * delta;
            if (camera.position.y < 2) { camera.position.y = 2; velocityY = 0; canJump = true; }

            // Animation automatique et fluide des mains quand on bouge
            const targetLeftHand = new THREE.Vector3().copy(baseHandL);
            const targetRightHand = new THREE.Vector3().copy(baseHandR);
            if (moveForward !== 0 || moveRight !== 0) {
                const wave = Math.sin(elapsed * 8) * 0.05;
                targetLeftHand.y += wave; targetLeftHand.z += wave * 0.5;
                targetRightHand.y -= wave; targetRightHand.z -= wave * 0.5;
            }
            leftHand.position.lerp(targetLeftHand, 0.2); rightHand.position.lerp(targetRightHand, 0.2);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
