<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rec Room - Dorm Room Local Test</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none; background-color: #000; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Écran de connexion simplifié */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff5722; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        .btn { padding: 15px 35px; font-size: 18px; background: white; color: #ff5722; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        /* Joysticks tactiles */
        #touch-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: box-none; display: none; }
        .joystick-base { position: absolute; width: 85px; height: 85px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .joystick-knob { width: 35px; height: 35px; border-radius: 50%; position: absolute; }
        #joy-move { bottom: 20px; left: 20px; }
        #joy-hand-l { top: 20px; left: 20px; }
        #joy-hand-r { top: 20px; right: 20px; }
        #joy-move .joystick-knob { background: #ff5722; }
        #joy-hand-l .joystick-knob { background: #00bcd4; }
        #joy-hand-r .joystick-knob { background: #4caf50; }
        #jump-button { position: absolute; bottom: 30px; right: 20px; width: 70px; height: 50px; background: rgba(255, 87, 34, 0.8); border: 2px solid white; border-radius: 25px; color: white; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: 12px; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="login-screen">
        <h1 style="margin-bottom: 20px;">DORM ROOM (MODE TEST)</h1>
        <button class="btn" id="btn-start">LANCER LE JEU</button>
    </div>

    <div id="touch-controls">
        <div class="joystick-base" id="joy-move"><div class="joystick-knob" id="knob-move"></div></div>
        <div class="joystick-base" id="joy-hand-l"><div class="joystick-knob" id="knob-hand-l"></div></div>
        <div class="joystick-base" id="joy-hand-r"><div class="joystick-knob" id="knob-hand-r"></div></div>
        <div id="jump-button">SAUT</div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        
        let camera, scene, renderer, leftHand, rightHand;
        
        let moveForward = 0, moveRight = 0, handL_X = 0, handL_Y = 0, handR_X = 0, handR_Y = 0;
        let canJump = false, velocityY = 0;
        let lon = -90, lat = 0, phi = 0, theta = 0;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0, onPointerDownLon = 0, onPointerDownLat = 0;

        const clock = new THREE.Clock();
        const baseHandL = new THREE.Vector3(-0.4, -0.4, -0.8);
        const baseHandR = new THREE.Vector3(0.4, -0.4, -0.8);

        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('touch-controls').style.display = 'block';
            initGame();
        });

        function initGame() {
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 0); // Centre exact de la pièce

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0f2e);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sunLight = new THREE.DirectionalLight(0xfff1e0, 0.6);
            sunLight.position.set(5, 8, 5);
            scene.add(sunLight);

            // --- DECOR DORM ROOM ---
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xd7ccc8, roughness: 0.6 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), floorMat);
            floor.rotation.x = -Math.PI / 2; scene.add(floor);

            const rug = new THREE.Mesh(new THREE.BoxGeometry(6, 0.02, 6), new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.9 }));
            rug.position.set(0, 0.01, 0); scene.add(rug);

            const wallOrange = new THREE.MeshStandardMaterial({ color: 0xe65100 });
            const wallBlue = new THREE.MeshStandardMaterial({ color: 0x0277bd });
            const wallWhite = new THREE.MeshStandardMaterial({ color: 0xeceff1 });

            const backWall = new THREE.Mesh(new THREE.BoxGeometry(12, 5, 0.4), wallBlue); backWall.position.set(0, 2.5, -6); scene.add(backWall);
            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(12, 5, 0.4), wallWhite); frontWall.position.set(0, 2.5, 6); scene.add(frontWall);
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 12), wallOrange); leftWall.position.set(-6, 2.5, 0); scene.add(leftWall);
            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 12), wallWhite); rightWall.position.set(6, 2.5, 0); scene.add(rightWall);

            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), wallWhite);
            ceiling.position.y = 5; ceiling.rotation.x = Math.PI / 2; scene.add(ceiling);

            const bedGroup = new THREE.Group();
            const bedBase = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0x3e2723 })); bedBase.position.set(0, 0.3, 0);
            const mattress = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.4, 3.8), new THREE.MeshStandardMaterial({ color: 0xffa726 })); mattress.position.set(0, 0.7, 0);
            const pillow = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 0.8), new THREE.MeshStandardMaterial({ color: 0xffffff })); pillow.position.set(0, 0.9, -1.4);
            bedGroup.add(bedBase, mattress, pillow); bedGroup.position.set(-4.5, 0, -3.8); scene.add(bedGroup);

            const mirrorFrame = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 1.5), new THREE.MeshStandardMaterial({ color: 0xff5722 })); mirrorFrame.position.set(5.75, 1.8, 0);
            const mirrorGlass = new THREE.Mesh(new THREE.BoxGeometry(0.11, 2, 1.3), new THREE.MeshStandardMaterial({ color: 0xcfd8dc, roughness: 0, metalness: 0.9 })); mirrorGlass.position.set(5.75, 1.8, 0);
            scene.add(mirrorFrame, mirrorGlass);

            const handGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const handMat = new THREE.MeshStandardMaterial({ color: 0xff5722 });
            leftHand = new THREE.Mesh(handGeo, handMat); leftHand.position.copy(baseHandL); camera.add(leftHand);
            rightHand = new THREE.Mesh(handGeo, handMat); rightHand.position.copy(baseHandR); camera.add(rightHand);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            setupMobileControls();
            
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupMobileControls() {
            const jumpBtn = document.getElementById('jump-button');
            let moveTouchId = null, handLTouchId = null, handRTouchId = null;

            document.addEventListener('touchstart', (e) => {
                if(e.target.id === 'btn-start') return;

                const midWidth = window.innerWidth * 0.35;

                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    const x = touch.clientX; const y = touch.clientY;

                    if (x < midWidth && y > window.innerHeight - 180) {
                        moveTouchId = touch.identifier;
                    } 
                    else if (x < midWidth && y < 180) {
                        handLTouchId = touch.identifier;
                    } 
                    else if (x > window.innerWidth - midWidth && y < 180) {
                        handRTouchId = touch.identifier;
                    } 
                    else if (!(x > window.innerWidth - 120 && y > window.innerHeight - 120)) {
                        onPointerDownPointerX = x; onPointerDownPointerY = y;
                        onPointerDownLon = lon; onPointerDownLat = lat;
                    }
                }
            });

            document.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === moveTouchId) {
                        updateJoystick('joy-move', 'knob-move', touch, (nx, ny) => { moveRight = nx; moveForward = -ny; });
                    } else if (touch.identifier === handLTouchId) {
                        updateJoystick('joy-hand-l', 'knob-hand-l', touch, (nx, ny) => { handL_X = nx; handL_Y = -ny; });
                    } else if (touch.identifier === handRTouchId) {
                        updateJoystick('joy-hand-r', 'knob-hand-r', touch, (nx, ny) => { handR_X = nx; handR_Y = -ny; });
                    } else {
                        if(moveTouchId !== touch.identifier && handLTouchId !== touch.identifier && handRTouchId !== touch.identifier) {
                            lon = (touch.clientX - onPointerDownPointerX) * 0.2 + onPointerDownLon;
                            lat = (onPointerDownPointerY - touch.clientY) * 0.2 + onPointerDownLat;
                        }
                    }
                }
            });

            document.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === moveTouchId) { moveTouchId = null; resetJoystick('knob-move'); moveForward = 0; moveRight = 0; }
                    else if (touch.identifier === handLTouchId) { handLTouchId = null; resetJoystick('knob-hand-l'); handL_X = 0; handL_Y = 0; }
                    else if (touch.identifier === handRTouchId) { handRTouchId = null; resetJoystick('knob-hand-r'); handR_X = 0; handR_Y = 0; }
                }
            });

            function updateJoystick(baseId, knobId, touch, callback) {
                const base = document.getElementById(baseId); const knob = document.getElementById(knobId);
                const rect = base.getBoundingClientRect();
                const kx = Math.max(-35, Math.min(35, touch.clientX - (rect.left + 42)));
                const ky = Math.max(-35, Math.min(35, touch.clientY - (rect.top + 42)));
                knob.style.transform = `translate(${kx}px, ${ky}px)`;
                callback(kx / 35, ky / 35);
            }
            function resetJoystick(knobId) { document.getElementById(knobId).style.transform = 'translate(0px, 0px)'; }

            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (canJump) { velocityY = 11; canJump = false; } });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();
            const delta = Math.min(clock.getDelta(), 0.1);

            lat = Math.max(-85, Math.min(85, lat));
            phi = THREE.MathUtils.degToRad(90 - lat); 
            theta = THREE.MathUtils.degToRad(lon);

            const targetPosition = new THREE.Vector3(
                camera.position.x + Math.sin(phi) * Math.sin(theta),
                camera.position.y + Math.cos(phi),
                camera.position.z + Math.sin(phi) * Math.cos(theta)
            );
            camera.lookAt(targetPosition);

            const forwardDir = new THREE.Vector3(Math.sin(theta), 0, Math.cos(theta)).normalize();
            const rightDir = new THREE.Vector3(Math.sin(theta - Math.PI / 2), 0, Math.cos(theta - Math.PI / 2)).normalize();

            camera.position.addScaledVector(forwardDir, moveForward * 4 * delta);
            camera.position.addScaledVector(rightDir, moveRight * 4 * delta);

            velocityY -= 26 * delta; camera.position.y += velocityY * delta;
            if (camera.position.y < 2) { camera.position.y = 2; velocityY = 0; canJump = true; }

            const targetLeftHand = new THREE.Vector3(baseHandL.x + handL_X * 0.5, baseHandL.y + handL_Y * 0.5, baseHandL.z + (handL_Y !== 0 ? -Math.abs(handL_Y)*0.2 : 0));
            const targetRightHand = new THREE.Vector3(baseHandR.x + handR_X * 0.5, baseHandR.y + handR_Y * 0.5, baseHandR.z + (handR_Y !== 0 ? -Math.abs(handR_Y)*0.2 : 0));
            
            if (moveForward !== 0 || moveRight !== 0) {
                const wave = Math.sin(elapsed * 6) * 0.03;
                if(handL_X === 0 && handL_Y === 0) targetLeftHand.y += wave;
                if(handR_X === 0 && handR_Y === 0) targetRightHand.y -= wave;
            }

            leftHand.position.lerp(targetLeftHand, 0.2); rightHand.position.lerp(targetRightHand, 0.2);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
